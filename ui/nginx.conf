# Build1 single-origin gateway (harness). All apps served same-origin so
# cross-origin frame/SameSite-cookie restrictions don't apply.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- SPA (Ops Console harness) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static diagram HTMLs (volume-mounted from build1-mlops/diagrams) ----
    location /diagrams/ {
        alias /usr/share/nginx/html/diagrams/;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- Temporal UI (configured with TEMPORAL_UI_PUBLIC_PATH=/temporal/) ----
    location /temporal/ {
        proxy_pass http://temporal-ui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- MLflow UI (hash-routed; prefix-strip so /mlflow/x -> mlflow:5000/x) ----
    location /mlflow/ {
        proxy_pass http://mlflow:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- FastAPI interactive docs + OpenAPI spec ----
    location = /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /redoc { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # ---- Lifecycle / auth API ----
    location /auth/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /api/  { proxy_pass http://api:8000; proxy_set_header Host $host; }

    # ---- Predictions (serving router) ----
    location /v1/   { proxy_pass http://serving:8001; proxy_set_header Host $host; }
}
