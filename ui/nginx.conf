# mlops-demo single-origin gateway (harness). All apps served same-origin so
# cross-origin frame/SameSite-cookie restrictions don't apply.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. This resolver plus a *variable* in proxy_pass is
    # load-bearing: with a literal hostname nginx resolves it once at startup and
    # caches that IP for the process lifetime. Recreating a backend (e.g.
    # `docker compose up -d --build api`) gives it a new IP, and every proxied
    # route then 502s — including /auth/ — until nginx itself is restarted.
    # Routing through a variable forces a re-resolve, so that cannot happen.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- SPA (Ops Console harness) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static diagram HTMLs (volume-mounted from diagrams) ----
    location /diagrams/ {
        alias /usr/share/nginx/html/diagrams/;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- Temporal UI (configured with TEMPORAL_UI_PUBLIC_PATH=/temporal/) ----
    location /temporal/ {
        set $up_temporal http://temporal-ui:8080;
        proxy_pass $up_temporal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- MLflow UI (hash-routed; prefix-strip so /mlflow/x -> mlflow:5000/x) ----
    location /mlflow/ {
        set $up_mlflow http://mlflow:5000;
        rewrite ^/mlflow/(.*)$ /$1 break;
        proxy_pass $up_mlflow;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- FastAPI interactive docs + OpenAPI spec ----
    location = /openapi.json { set $up_api http://api:8000; proxy_pass $up_api; proxy_set_header Host $host; }
    location /docs { set $up_api http://api:8000; proxy_pass $up_api; proxy_set_header Host $host; }
    location /redoc { set $up_api http://api:8000; proxy_pass $up_api; proxy_set_header Host $host; }

    # ---- Lifecycle / auth API ----
    location /auth/ { set $up_api http://api:8000; proxy_pass $up_api; proxy_set_header Host $host; }
    location /api/  { set $up_api http://api:8000; proxy_pass $up_api; proxy_set_header Host $host; }

    # ---- Predictions (serving router) ----
    location /v1/   { set $up_serving http://serving:8001; proxy_pass $up_serving; proxy_set_header Host $host; }
}
