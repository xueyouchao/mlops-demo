# Pinned project name so the docker-compose project + volume prefix stay
# "mlops-demo" independent of the on-disk directory name.
name: mlops-demo
x-backend-env: &id001
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: mlplatform
  DB_URL: postgresql://postgres:postgres@postgres:5432/mlplatform
  JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
  AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-15}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: 7233
  SERVING_URL: http://serving:8001
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENV: ${SENTRY_ENV:-development}
  PYTHONUNBUFFERED: '1'
services:
  postgres:
    image: postgres:16-alpine
    container_name: mlops-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlplatform
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d mlplatform
      interval: 5s
      timeout: 5s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: mlops-demo-mlflow
    # Artifacts must live INSIDE the persisted volume. They previously went to
    # /mlflow-artifacts, a path in the container's writable layer, so every
    # container recreate silently deleted every model artifact while mlflow.db
    # (which does live in the volume) survived — leaving registry rows that
    # point at files that no longer exist.
    # --serve-artifacts additionally lets other services download artifacts over
    # HTTP, which is what makes real inference in `serving` possible at all.
    command: 'mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts'
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
    - 5000:5000
    volumes:
    - mlflow-artifacts:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/health',timeout=3);
        sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: mlops-demo-temporal
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_SEEDS=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_PWD=postgres
    - POSTGRES_DB=temporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 7233:7233
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z $(hostname -i) 7233 || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: mlops-demo-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8082,http://localhost:8233
      # No trailing slash: a trailing slash makes the UI emit doubled asset
      # URLs (/temporal//_app/...), which any proxy that normalises duplicate
      # slashes (Traefik) rewrites to a path that serves the SPA shell instead
      # of the JS module -> blank Temporal UI.
      TEMPORAL_UI_PUBLIC_PATH: /temporal
    depends_on:
      temporal:
        condition: service_healthy
    ports:
    - 8233:8080
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: mlops-demo-api
    environment: *id001
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: mlops-demo-worker
    # Worker-only agent knobs, merged over the shared env: the brain can be
    # swapped or the fallback demoed by recreating this one service, no rebuild.
    environment:
      <<: *id001
      AGENT_BRAIN_MODEL: ${AGENT_BRAIN_MODEL:-deepseek-v4.1-flash:cloud}
      AGENT_FALLBACK: ${AGENT_FALLBACK:-auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.23.0.1:11434}
      # Tracing is what makes the agent's model calls visible to Sentry at all:
      # the span carries the gen_ai.* attributes the LLM views read, and without
      # a sample rate the worker's spans are built and then dropped. A demo makes
      # few enough calls that keeping all of them is the honest default.
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
  serving:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    container_name: mlops-demo-serving
    environment: *id001
    ports:
    - 8001:8001
    depends_on:
      api:
        condition: service_started
  ui:
    build:
      context: ./ui
    container_name: mlops-demo-ui
    environment:
      VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
      VITE_API_HOST_SERVING: ${VITE_API_HOST_SERVING:-http://localhost:8001}
    depends_on:
    - api
    ports:
    - 8082:80
    volumes:
    - ./diagrams:/usr/share/nginx/html/diagrams:ro
  trainer:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: mlops-demo-trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: breast-cancer-classifier
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
    - tools
volumes:
  pgdata: null
  mlflow-artifacts: null
