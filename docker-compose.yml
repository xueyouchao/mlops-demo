x-backend-env: &id001
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: mlplatform
  DB_URL: postgresql://postgres:postgres@postgres:5432/mlplatform
  JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
  AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-15}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: 7233
  SERVING_URL: http://serving:8001
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENV: ${SENTRY_ENV:-development}
  PYTHONUNBUFFERED: '1'
services:
  postgres:
    image: postgres:16-alpine
    container_name: build1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlplatform
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d mlplatform
      interval: 5s
      timeout: 5s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: build1-mlflow
    command: 'mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow-artifacts

      '
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
    - 5000:5000
    volumes:
    - mlflow-artifacts:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/health',timeout=3);
        sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 12
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: build1-temporal
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_SEEDS=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_PWD=postgres
    - POSTGRES_DB=temporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 7233:7233
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z $(hostname -i) 7233 || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: build1-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8082,http://localhost:8233
      TEMPORAL_UI_PUBLIC_PATH: /temporal/
    depends_on:
      temporal:
        condition: service_healthy
    ports:
    - 8233:8080
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: build1-api
    environment: *id001
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: build1-worker
    environment: *id001
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
  serving:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    container_name: build1-serving
    environment: *id001
    ports:
    - 8001:8001
    depends_on:
      api:
        condition: service_started
  ui:
    build:
      context: ./ui
    container_name: build1-ui
    environment:
      VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8000}
      VITE_API_HOST_SERVING: ${VITE_API_HOST_SERVING:-http://localhost:8001}
    depends_on:
    - api
    ports:
    - 8082:80
    volumes:
    - ./diagrams:/usr/share/nginx/html/diagrams:ro
  trainer:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: build1-trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: breast-cancer-classifier
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
    - tools
volumes:
  pgdata: null
  mlflow-artifacts: null
