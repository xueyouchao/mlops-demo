<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — console agent panel</title>
<!--
  ============================================================================
  PROTOTYPE — THROWAWAY. Answers one question, then gets deleted from main.

  Question (wayfinder ticket T07): what does the agent panel look like and read
  like, live, while a run is in flight?

  Three structurally different variants, switchable with ?variant=A|B|C and the
  floating bar at the bottom (or ← / →):

    A  Timeline    one vertical spine, decision → tool call → observation,
                   low density, causality first. Lives in its own sidebar entry.
    B  Scratchpad  chat-style, dense, newest at the bottom, mounted as a SECTION
                   of the existing Ops Console page rather than a new tab.
    C  Inspector   two-pane debugger: step list on the left, one selected step's
                   detail on the right. Full-height tab.

  ?state= switches the fake run through every moment that has to be judged:
  in-flight · worker-dead · resumed · awaiting-approval · concluded ·
  budget_exhausted · no_progress · failed.

  THIS IS FAKE DATA. Nothing here talks to Temporal, the API, or a workflow.
  The CSS below is copied by hand from ui/src/style.css so the mock sits in the
  real console's chrome; it is not a shared stylesheet and must not become one.

  Nothing in this file is production code: no tests, no error handling, no
  abstractions. Fold the winning variant into ui/src properly, then bin this.
  ============================================================================
-->
<style>
/* ---- copied from ui/src/style.css (console shell) ---- */
:root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #eef0f4; color: #14161a; }
button { font: inherit; }
.hint { font-size: 12px; opacity: 0.6; }
.harness { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 230px; flex: 0 0 230px; background: #161a1f; color: #e6e9ee; display: flex; flex-direction: column; padding: 12px 10px; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: 0.03em; padding: 6px 10px 14px; color: #fff; }
.section { margin-top: 6px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #7c8896; padding: 6px 10px 4px; }
.nav { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 1px 0; border: 0; border-radius: 6px; background: transparent; color: #cfd6df; cursor: pointer; font-size: 13.5px; text-decoration: none; }
.nav:hover { background: #232a32; color: #fff; }
.nav.active { background: #2563eb; color: #fff; }
.spacer { flex: 1; }
.who-line { border-top: 1px solid #2b333c; padding: 10px 10px 2px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: #9aa5b1; }
.who-line .ghost { background: transparent; border: 1px solid #3a4450; color: #cfd6df; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #13161a; }
.pane-head { height: 42px; flex: 0 0 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #0f1216; color: #e6e9ee; border-bottom: 1px solid #222a33; }
.pane-title { font-size: 14px; font-weight: 600; }
.pane-group { font-size: 12px; color: #7c8896; }
.pane .ops { flex: 1; background: #eef0f4; overflow: auto; padding: 20px; max-width: 980px; margin: 0 auto; width: 100%; }
/* ---- copied from ui/src/style.css (ops content conventions) ---- */
.ops { color: #14161a; }
.ops section { background: #fff; border: 1px solid #dde1e7; border-radius: 10px; padding: 16px; margin-top: 14px; }
.ops h1 { font-size: 20px; } .ops h2 { font-size: 15px; margin-top: 0; }
.ops button { margin-right: 8px; padding: 6px 12px; border-radius: 6px; border: 1px solid #2563eb; background: #eef3ff; color: #1d4ed8; cursor: pointer; }
.ops button:hover { background: #dbe6ff; }
.ops button.ghost { background: #fff; border-color: #b9c0c9; color: #333; }
.ops button[disabled] { opacity: 0.5; cursor: not-allowed; }
.ops table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ops td, .ops th { border: 1px solid #eef0f4; padding: 6px 8px; text-align: left; }
.ops input { padding: 5px; border: 1px solid #999; border-radius: 4px; }
.ops pre { background: #0e1116; color: #d3e0f0; padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; max-height: 260px; }
.err { background: #fdd; border: 1px solid #c66; color: #800; padding: 8px 12px; border-radius: 6px; margin: 10px 0; }
.ops .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 12px 0 4px; }
.ops .row label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #444; }
.ops .status { font-size: 12.5px; margin: 8px 0 0; }
.ops .status b { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.stage-production { color: #0a7; font-weight: 600; }
.stage-staging { color: #a70; }
h2 + .hint { margin-top: -6px; }

/* ---- prototype-only chrome (not part of the console) ---- */
.proto-note { background: #fff7e0; border: 1px solid #e2c56a; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; }
.proto-note b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.statebar { background: #fff; border: 1px solid #dde1e7; border-radius: 10px; padding: 12px 16px; }
.statebar .ops { padding: 0; }
.statebar button { font-size: 12px; padding: 5px 10px; }
.statebar button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
.switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 10px; background: #0f1216; color: #fff;
  border: 1px solid #3a4450; border-radius: 999px; padding: 7px 9px; box-shadow: 0 8px 26px rgba(0,0,0,.4); font-size: 12.5px; }
.switcher button { background: #232a32; color: #fff; border: 1px solid #3a4450; border-radius: 999px; width: 28px; height: 28px; cursor: pointer; line-height: 1; }
.switcher button:hover { background: #2563eb; }
.switcher .lbl { min-width: 260px; text-align: center; }
.switcher .k { opacity: .55; }

/* ---- shared prototype pieces: chips, clocks, approval ---- */
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; border: 1px solid #c9d2de; background: #f4f6fa; color: #3b4657; }
.chip.run { border-color: #9dc0f5; background: #eaf2ff; color: #1d4ed8; }
.chip.ok { border-color: #9ad3b0; background: #eafaf0; color: #0a7a45; }
.chip.warn { border-color: #e2c56a; background: #fff7e0; color: #8a6a10; }
.chip.bad { border-color: #d99; background: #fdecec; color: #a11; }
.chip.fallback { border-color: #b9a6e6; background: #f2ecfd; color: #5b3fb0; }
.clocks { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: #3b4657; }
.clocks b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.clocks .split { color: #7c8896; }
.runhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.runhead .goal { flex: 1 1 320px; font-size: 13.5px; }
.runhead .goal i { color: #444; }
.durable { border: 1px dashed #a9b6c6; background: #f7f9fc; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: #37475c; margin: 10px 0 0; }
.durable b { color: #1d4ed8; }
.resume { border-left: 3px solid #0a7a45; background: #f2fbf5; border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 12.5px; margin: 10px 0 0; }
.approval { border: 1px solid #9dc0f5; background: #f7fbff; border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.approval h3 { margin: 0 0 4px; font-size: 14.5px; }
.cmp { width: auto; margin: 10px 0 6px; font-size: 12.5px; }
.cmp td, .cmp th { border: 1px solid #dbe6f5; padding: 5px 10px; }
.cmp .up { color: #0a7a45; font-weight: 600; }
.cmp .down { color: #a11; }
.cmp .same { color: #666; }
.cancelq { margin-top: 10px; font-size: 12px; color: #5b3fb0; }

/* ---- Variant A — timeline ---- */
.tl { margin: 0; padding: 0; list-style: none; }
.tl-step { display: flex; gap: 14px; }
.tl-rail { flex: 0 0 30px; display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 26px; height: 26px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.tl-step.fallback .tl-dot { background: #7c5cd6; }
.tl-step.ended .tl-dot { background: #0a7a45; }
.tl-line { flex: 1; width: 2px; background: #d5dbe4; }
.tl-body { flex: 1; padding: 0 0 22px; }
.tl-when { font-size: 11.5px; color: #7c8896; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.tl-decide { font-size: 13.5px; margin: 3px 0 8px; }
.tl-tool { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: #eef3ff; border: 1px solid #cfe0ff; color: #1d4ed8; border-radius: 6px; padding: 6px 10px; display: inline-block; }
.tl-obs { font-size: 12.5px; color: #2c3a4d; background: #f4f6fa; border-left: 3px solid #c9d2de; border-radius: 0 6px 6px 0; padding: 8px 10px; margin-top: 8px; }
.tl-obs b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ---- Variant B — scratchpad (chat) ---- */
.chat { border: 1px solid #dde1e7; border-radius: 8px; background: #fbfcfe; padding: 12px; max-height: 460px; overflow: auto; }
.msg { margin: 8px 0; font-size: 13px; }
.msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #7c8896; margin-bottom: 3px; }
.msg.brain .bubble { background: #eef3ff; border: 1px solid #cfe0ff; border-radius: 8px; padding: 8px 10px; }
.msg.tool .bubble { background: #fff; border: 1px dashed #b9c0c9; border-radius: 8px; padding: 6px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #1d4ed8; display: inline-block; }
.msg.obs .bubble { background: #f4f6fa; border: 1px solid #e1e6ee; border-radius: 8px; padding: 8px 10px; color: #2c3a4d; font-size: 12.5px; }
.msg.sys .bubble { background: #fff7e0; border: 1px solid #e2c56a; border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.msg.fallback .who { color: #5b3fb0; }
.composer { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
.composer textarea { flex: 1; min-height: 46px; padding: 8px; border: 1px solid #999; border-radius: 6px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }

/* ---- Variant C — inspector ---- */
.insp { flex: 1; display: flex; min-height: 0; background: #eef0f4; }
.insp-side { flex: 0 0 330px; background: #fff; border-right: 1px solid #dde1e7; display: flex; flex-direction: column; min-height: 0; }
.insp-side .top { padding: 12px 14px; border-bottom: 1px solid #eef0f4; }
.insp-list { overflow: auto; flex: 1; }
.insp-item { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; border-bottom: 1px solid #f2f4f7; cursor: pointer; font-size: 12.5px; }
.insp-item:hover { background: #f7f9fc; }
.insp-item.sel { background: #eef3ff; border-left: 3px solid #2563eb; }
.insp-item .n { color: #7c8896; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.insp-item .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #1d4ed8; }
.insp-item .ms { margin-left: auto; color: #7c8896; font-size: 11.5px; }
.insp-detail { flex: 1; min-width: 0; overflow: auto; padding: 18px 20px; }
.insp-detail h3 { margin: 0 0 2px; font-size: 15px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #1d4ed8; }
.insp-block { background: #fff; border: 1px solid #dde1e7; border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
.insp-block h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #7c8896; }
</style>
</head>
<body>
<div class="harness">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="pane">
    <div class="pane-head">
      <span class="pane-title" id="paneTitle"></span>
      <span class="pane-group" id="paneGroup"></span>
    </div>
    <div id="paneBody" style="flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;"></div>
  </main>
</div>

<div class="switcher">
  <button id="prev" title="previous variant (←)">←</button>
  <span class="lbl" id="swLbl"></span>
  <button id="next" title="next variant (→)">→</button>
  <span class="k">prototype · fake data</span>
</div>

<script>
/* ===========================================================================
   Fake run. Shaped by the decisions already made on the map, so what is being
   judged is the presentation and not invented mechanics:

   - one step = one brain call → exactly one tool call → one observation (T01)
   - the six tools are the allow-list (T02), results are bounded digests
   - the kill lands between steps; the resume must be visible (T06)
   - work time and gate wait are separate clocks (T06)
   - a repeated identical call ends the run as no_progress; one of four reasons
   - the fallback is labelled wherever it decided (T06)
   - the proposal is a real pending promotion, and the run WAITS on the human (T05)
   =========================================================================== */

const TOOLS = {
  read_registry:      { args: "()" },
  read_run_metrics:   { args: "(run_id=\"mlflow-run-9f21\")" },
  evaluate_version:   { args: "(version=5)" },
  train_candidate:    { args: "(n_estimators=300, max_depth=6, learning_rate=0.05)" },
  evaluate_version6:  { args: "(version=6)" },
  propose_promotion:  { args: "(version=6, rationale=\"…\")" },
};

const STEP1 = { n:1, tool:"read_registry", label:"read_registry()", secs:2.8, producer:"model",
  rationale:"Nothing can be judged before knowing what is actually serving traffic.",
  obs:"5 versions · v5 Production (acc .842) · v2 v3 v4 Archived · routing {v5: 100%}" };

const STEP2 = { n:2, tool:"read_run_metrics", label:'read_run_metrics(run_id="mlflow-run-9f21")', secs:2.9, producer:"model",
  rationale:"The incumbent's hyperparameters tell me which direction is worth moving in.",
  obs:"n_estimators 120 · max_depth 3 · learning_rate 0.08 · test_size 0.2 · random_state 42" };

const STEP3 = { n:3, tool:"evaluate_version", label:"evaluate_version(version=5)", secs:4.1, producer:"model",
  rationale:"A baseline is needed on the same split the candidate will be judged on.",
  obs:"accuracy 0.842 · roc_auc 0.871 · precision 0.79 · recall 0.74  (test 20%, seed 42)" };

const STEP4 = { n:4, tool:"train_candidate", label:"train_candidate(n_estimators=300, max_depth=6, learning_rate=0.05)", secs:21.4, producer:"model",
  rationale:"Depth 3 with 120 trees underfits this data. A deeper forest with a slower learning rate is the obvious next probe.",
  obs:"registered v6 (Staging) · accuracy 0.878 · roc_auc 0.904 · run 4c7e · artifact present" };

const STEP5 = { n:5, tool:"evaluate_version", label:"evaluate_version(version=6)", secs:3.6,
  producer:"fallback", producerNote:"scripted policy — ollama unreachable",
  rationale:"Confirm the new version on the baseline's split before proposing anything. [scripted policy]",
  obs:"accuracy 0.878 · roc_auc 0.904 · precision 0.83 · recall 0.79  (test 20%, seed 42)" };

const STEP6 = { n:6, tool:"propose_promotion", label:'propose_promotion(version=6, rationale="…")', secs:1.2, producer:"model",
  rationale:"v6 beats the incumbent on both metrics on the same split (accuracy +0.036, roc_auc +0.033), its artifact is servable, and rollback stays one gate away.",
  obs:"pending promotion promote-model-6 · awaiting operator" };

const STEP6B = { n:6, tool:"read_registry", label:"read_registry()", secs:2.7, producer:"model",
  rationale:"Nothing can be judged before knowing what is actually serving traffic.",
  obs:"5 versions · v5 Production (acc .842) · v2 v3 v4 Archived · routing {v5: 100%}" };

const STEP7 = { n:7, tool:"train_candidate", label:"train_candidate(n_estimators=500, max_depth=4, learning_rate=0.12)", secs:19.8, producer:"model",
  rationale:"That direction helped; push the same axis further before giving up on beating it.",
  obs:"registered v7 (Staging) · accuracy 0.851 · roc_auc 0.882 · run 8b02 · artifact present" };

const STEP8 = { n:8, tool:"evaluate_version", label:"evaluate_version(version=7)", secs:3.9, producer:"model",
  rationale:"Last step of my budget — check the second candidate before concluding.",
  obs:"accuracy 0.851 · roc_auc 0.882 · precision 0.80 · recall 0.77  (test 20%, seed 42)" };

const AWAITING = { n:7, tool:"awaiting-approval", label:"— waiting on the operator —", secs:0, producer:"human",
  rationale:"The proposal is filed. Nothing else may be proposed for this model until this one is decided.",
  obs:"promotion promote-model-6 is pending · the run holds here, durably" };

const STATES = {
  "in-flight": {
    chip:["run","running"], steps:[STEP1,STEP2,STEP3], work:"0:31", gate:"—", stepsUsed:"3 / 8",
    note:"Steps 4–8 not yet recorded. The next action is a brain call.",
  },
  "worker-dead": {
    chip:["bad","worker down · run durable"], steps:[STEP1,STEP2,STEP3], work:"0:31", gate:"—", stepsUsed:"3 / 8",
    dead:true,
    note:"The worker was killed between steps. Temporal holds the run; the transcript above is read from history on the server, so it is still complete — nothing is lost, and nothing is stale.",
  },
  "resumed": {
    chip:["ok","resumed"], steps:[STEP1,STEP2,STEP3,STEP4], work:"0:54", gate:"—", stepsUsed:"4 / 8",
    resumed:true,
    note:"The worker came back and replayed the recorded steps from history. Step 4 ran for the first time; steps 1–3 were not executed again, and no brain call was repeated.",
  },
  "awaiting-approval": {
    chip:["warn","awaiting approval"], steps:[STEP1,STEP2,STEP3,STEP4,STEP5,STEP6], work:"0:41", gate:"2:13", stepsUsed:"6 / 8",
    awaiting:true,
    note:"The run is alive and waiting on a human. The gate wait is counted separately from work — a slow operator must not look like a slow agent.",
  },
  "concluded": {
    chip:["ok","concluded"], steps:[STEP1,STEP2,STEP3,STEP4,STEP5,STEP6,AWAITING], work:"0:41", gate:"6:02", stepsUsed:"6 / 8",
    ending:{ reason:"concluded", text:"Promoted v6 on the operator's approval at 14:22. Serving now routes 100% to v6." },
    note:"The decision lands in the ending — not as a step — because a step is a brain call, and the human is not one.",
  },
  "budget_exhausted": {
    chip:["warn","budget_exhausted"], steps:[STEP1,STEP2,STEP3,STEP4,STEP5,STEP6B,STEP7,STEP8], work:"1:02", gate:"—", stepsUsed:"8 / 8",
    ending:{ reason:"budget_exhausted", text:"Spent all 8 steps without beating the incumbent. v6 (+0.036) was the best candidate but its promotion was refused; v7 regressed to 0.851. Nothing promoted — no better candidate is a legitimate result." },
    note:"Running out of budget is not a crash: the run says what it found and what it did not do.",
  },
  "no_progress": {
    chip:["bad","no_progress"], steps:[STEP1,STEP2,STEP6B], work:"0:09", gate:"—", stepsUsed:"3 / 8",
    ending:{ reason:"no_progress", text:"Ended at step 3: read_registry() was called with the same arguments twice in a row. Nothing had changed in between, so the call could not return anything new." },
    note:"Guards against a brain that loops. Only an immediate identical repeat trips it — re-reading after a training is legitimate, because the state changed.",
  },
  "failed": {
    chip:["bad","failed"], steps:[STEP1,STEP2], work:"0:06", gate:"—", stepsUsed:"2 / 8",
    ending:{ reason:"failed", text:"Brain unreachable after 3 attempts (ollama at 172.23.0.1:11434) and the scripted fallback is switched off (AGENT_FALLBACK=off), so there was nothing left to decide with." },
    note:"The only genuinely hard ending. With the fallback on — the default — this cannot happen.",
  },
};

const VARIANTS = {
  A: { name:"Timeline",    group:"Lifecycle",  nav:"agent",  title:"Investigation Agent" },
  B: { name:"Scratchpad",  group:"Lifecycle",  nav:"ops",    title:"Ops Console" },
  C: { name:"Inspector",   group:"Lifecycle",  nav:"agent",  title:"Investigation Agent" },
};

const GOAL = "Production is v5 — is there a better candidate?";
const WHO  = "operator";
const RUNID = "agent-7f3c";

const qs = new URLSearchParams(location.search);
const variant = (qs.get("variant") || "A").toUpperCase();
const stateKey = qs.get("state") || "awaiting-approval";
const selectedStep = Number(qs.get("step") || 4);
const S = STATES[stateKey] || STATES["awaiting-approval"];
const V = VARIANTS[variant] || VARIANTS.A;

const setParam = (k, v) => { qs.set(k, v); history.replaceState(null, "", "?" + qs.toString()); render(); };

const chipHtml = ([cls, text]) => `<span class="chip ${cls}">${text}</span>`;
const producerHtml = (s) => s.producer === "fallback"
  ? `<span class="chip fallback">scripted policy</span>` : "";
const esc = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- shared strips (facts every variant must show) ---------- */
function headerStrip() {
  return `
    <div class="runhead">
      <span>${chipHtml(S.chip)}</span>
      <span class="goal"><i>goal</i> “${GOAL}” <span class="hint">— started by ${WHO} · run ${RUNID}</span></span>
    </div>
    <div class="clocks" style="margin-top:8px">
      <span>steps <b>${S.stepsUsed}</b></span>
      <span>work <b>${S.work}</b></span>
      <span>waiting on human <b>${S.gate}</b></span>
      <span class="split">separate clocks — the 3-minute ceiling excludes the gate wait</span>
    </div>`;
}

function stateNote() {
  return `<p class="hint" style="margin-top:10px">${S.note}</p>`;
}

function durableNote() {
  if (S.dead) return `<div class="durable"><b>worker down — run durable.</b> The worker process is not running. This transcript is read from Temporal's history, not from the worker, so it is complete and current as of the last recorded step — and it stays readable for as long as the worker is gone.</div>`;
  if (S.resumed) return `<div class="resume"><b>Resumed.</b> Steps 1–3 replayed from history without re-executing; the run continued at step 4. Nothing was repeated and no model call was paid for twice.</div>`;
  return "";
}

function endingBlock() {
  if (!S.ending) return "";
  const cls = S.ending.reason === "concluded" ? "ok" : "warn";
  return `
    <div class="approval" style="border-color:#dde1e7; background:#fff">
      <h3>${chipHtml([cls, S.ending.reason])} how the run ended</h3>
      <p style="margin:6px 0 0; font-size:13px">${S.ending.text}</p>
    </div>`;
}

function approvalCard() {
  if (S.ending) {
    return `
    <div class="approval" style="border-color:#9ad3b0; background:#f4fdf8">
      <h3>Decided — v6 promoted</h3>
      <p class="hint" style="margin:2px 0 8px">Approved by ${WHO} after 6:02 of waiting. The run recorded the real outcome from Temporal, not the API's acknowledgement.</p>
      <button class="ghost">Open transcript →</button>
    </div>`;
  }
  if (!S.awaiting) return "";
  return `
  <div class="approval">
    <h3>Proposal — approve to put v6 into production</h3>
    <p class="hint" style="margin:2px 0 8px">
      One pending promotion for this model. Filed by the run, waiting on a human.
    </p>
    <table class="cmp">
      <thead><tr><th>metric</th><th>incumbent v5</th><th>candidate v6</th><th>change</th></tr></thead>
      <tbody>
        <tr><td>accuracy</td><td>0.842</td><td>0.878</td><td class="up">+0.036</td></tr>
        <tr><td>roc_auc</td><td>0.871</td><td>0.904</td><td class="up">+0.033</td></tr>
      </tbody>
    </table>
    <p class="hint" style="margin:0 0 8px">Both measured on the same held-out split — test 20%, seed 42 — so the comparison is apples to apples.</p>
    <p style="font-size:13px; margin:8px 0"><b>Why:</b> “v6 beats the incumbent on both metrics on the same split, its artifact is servable, and rollback stays one gate away.”</p>
    <p class="hint" style="margin:0 0 10px">Cost paid: 6 steps, 1 training, 41s of work.</p>
    <button>Approve</button>
    <button class="ghost">Decline</button>
    <button class="ghost">Open transcript →</button>
    <p class="cancelq">prototype question: is there a <b>Cancel run</b> here? Without one, “never decides” has no escape.</p>
  </div>`;
}

/* ---------- Variant A — timeline ---------- */
function variantA() {
  const steps = S.steps.map((s, i) => `
    <li class="tl-step ${s.producer === "fallback" ? "fallback" : ""} ${s.tool === "awaiting-approval" ? "ended" : ""}">
      <div class="tl-rail"><span class="tl-dot">${s.n}</span>${i < S.steps.length - 1 ? '<span class="tl-line"></span>' : ""}</div>
      <div class="tl-body">
        <div class="tl-when">step ${s.n} · ${s.secs ? s.secs.toFixed(1) + "s" : "—"} ${producerHtml(s)}</div>
        <div class="tl-decide">${esc(s.rationale)}</div>
        <div class="tl-tool">${esc(s.label)}</div>
        <div class="tl-obs">${esc(s.obs)}</div>
      </div>
    </li>`).join("");

  const notYet = S.dead || stateKey === "in-flight"
    ? `<li class="tl-step"><div class="tl-rail"><span class="tl-dot" style="background:#c9d2de; color:#5b6877">·</span></div>
        <div class="tl-body"><div class="hint">steps ${S.steps.length + 1}–8 not yet recorded</div></div></li>`
    : "";

  return `
  <div class="ops">
    <div class="proto-note"><b>PROTOTYPE A — Timeline.</b> One vertical spine. Judge it on whether the reasoning is legible at a glance from the back of a room.</div>
    <section>${headerStrip()}${stateNote()}${durableNote()}</section>
    <section><h2>The run</h2><ul class="tl">${steps}${notYet}</ul></section>
    ${approvalCard()}
    ${endingBlock()}
  </div>`;
}

/* ---------- Variant B — scratchpad ---------- */
function variantB() {
  const msgs = S.steps.map((s) => `
    <div class="msg brain ${s.producer === "fallback" ? "fallback" : ""}">
      <div class="who">agent ${s.producer === "fallback" ? "· scripted policy (ollama unreachable)" : ""}</div>
      <div class="bubble">${esc(s.rationale)}</div>
    </div>
    <div class="msg tool"><div class="who">tool call</div><div class="bubble">${esc(s.label)}</div></div>
    <div class="msg obs"><div class="who">observation</div><div class="bubble">${esc(s.obs)}</div></div>`).join("");

  const dead = S.dead ? `<div class="msg sys"><div class="who">system</div><div class="bubble"><b>worker down — run durable.</b> The transcript above comes from Temporal's history, so it survives the worker being gone. No further steps can be recorded until it returns.</div></div>` : "";
  const resumed = S.resumed ? `<div class="msg sys"><div class="who">system</div><div class="bubble"><b>worker back — resumed from history.</b> Steps 1–3 replayed, not re-executed. Continuing at step 4.</div></div>` : "";

  return `
  <div class="ops">
    <div class="proto-note"><b>PROTOTYPE B — Scratchpad.</b> The panel as a <b>section of the existing Ops Console page</b>, not a new tab — so it sits between the real version table and the real audit log at real density.</div>

    <section>
      <h2>Versions &amp; Stages</h2>
      <table>
        <thead><tr><th>id</th><th>stage</th><th>run</th><th>traffic %</th></tr></thead>
        <tbody>
          <tr><td>5</td><td class="stage-production">Production</td><td>mlflow-run-9f21</td><td>100</td></tr>
          <tr><td>6</td><td class="stage-staging">Staging</td><td>4c7e</td><td>0</td></tr>
          <tr><td>4</td><td>Archived</td><td>—</td><td>0</td></tr>
        </tbody>
      </table>
      <p class="hint" style="margin-top:8px">unchanged from the real console — the agent panel slots in below it</p>
    </section>

    <section>
      <h2>Investigation agent</h2>
      ${headerStrip()}
      ${durableNote()}
      <div class="chat" style="margin-top:12px">${msgs}${dead}${resumed}</div>
      <div class="composer">
        <textarea rows="2" placeholder="goal — e.g. “production is v5, is there a better candidate?”">${GOAL}</textarea>
        <div>
          <button>Investigate</button>
          <div class="hint" style="margin-top:6px">presets: “is there a better candidate?” · “why is v5 live?” · “can we roll back?”</div>
        </div>
      </div>
      ${stateNote()}
      ${approvalCard()}
      ${endingBlock()}
    </section>

    <section>
      <h2>Audit / Lineage (events)</h2>
      <pre>[{"event":"MODEL_PROMOTED","version":"5","at":"14:02"}, …]</pre>
    </section>
  </div>`;
}

/* ---------- Variant C — inspector ---------- */
function variantC() {
  const list = S.steps.map((s) => `
    <div class="insp-item ${s.n === selectedStep ? "sel" : ""}" onclick="setParam('step','${s.n}')">
      <span class="n">${String(s.n).padStart(2, "0")}</span>
      <span class="t">${esc(s.tool)}</span>
      ${s.producer === "fallback" ? '<span class="chip fallback" style="font-size:10.5px">fallback</span>' : ""}
      <span class="ms">${s.secs ? s.secs.toFixed(1) + "s" : "—"}</span>
    </div>`).join("");

  const cur = S.steps.find((s) => s.n === selectedStep) || S.steps[S.steps.length - 1];

  return `
  <div class="insp">
    <div class="insp-side">
      <div class="top">
        <div>${chipHtml(S.chip)} ${producerHtml(cur)}</div>
        <div class="hint" style="margin-top:6px">run ${RUNID} · steps ${S.stepsUsed} · work ${S.work} · wait ${S.gate}</div>
      </div>
      <div class="insp-list">${list}</div>
      <div class="top" style="border-top:1px solid #eef0f4; border-bottom:0">
        <div class="hint">${S.awaiting ? "1 pending promotion — open it in the detail pane" : "no pending promotion"}</div>
      </div>
    </div>
    <div class="insp-detail">
      <div class="proto-note"><b>PROTOTYPE C — Inspector.</b> Two-pane debugger: scan the spine on the left, read one step in full on the right. Click a step.</div>
      ${durableNote()}
      <h3>${esc(cur.label)}</h3>
      <div class="hint">step ${cur.n} of 8 · ${cur.secs ? cur.secs.toFixed(1) + "s" : "—"} · ${cur.producer === "fallback" ? "produced by the scripted policy" : "produced by deepseek-v4-flash"}</div>

      <div class="insp-block"><h4>why the agent did this</h4>
        <div style="font-size:13.5px">${esc(cur.rationale)}</div>
        ${cur.producerNote ? `<div class="hint" style="margin-top:6px">${esc(cur.producerNote)} — labelled so a viewer is never misled about who decided.</div>` : ""}
      </div>

      <div class="insp-block"><h4>tool call</h4>
        <div class="tl-tool">${esc(cur.label)}</div>
        <div class="hint" style="margin-top:8px">arguments are recorded in history verbatim, which is what makes the replay deterministic</div>
      </div>

      <div class="insp-block"><h4>observation</h4>
        <div style="font-size:12.5px; color:#2c3a4d">${esc(cur.obs)}</div>
      </div>

      <div class="insp-block"><h4>run</h4>
        ${headerStrip()}
        ${stateNote()}
      </div>

      ${approvalCard()}
      ${endingBlock()}
    </div>
  </div>`;
}

/* ---------- shell ---------- */
function sidebar() {
  const navFor = (id, label) => id === "agent"
    ? `<a class="nav ${V.nav === "agent" ? "active" : ""}" href="?variant=${variant}&state=${stateKey}">${label}</a>`
    : `<button class="nav ${V.nav === id ? "active" : ""}" disabled>${label}</button>`;
  return `
    <div class="brand">mlops-demo</div>
    <div class="section"><div class="section-label">Lifecycle</div>
      ${navFor("ops", "Ops Console")}
      ${navFor("agent", "Investigation Agent")}
    </div>
    <div class="section"><div class="section-label">Diagrams</div>
      <button class="nav" disabled>Architecture</button>
      <button class="nav" disabled>Workflow</button>
      <button class="nav" disabled>Lifecycle</button>
    </div>
    <div class="section"><div class="section-label">Apps &amp; docs</div>
      <button class="nav" disabled>Temporal UI</button>
      <button class="nav" disabled>MLflow UI</button>
      <button class="nav" disabled>API Docs</button>
    </div>
    <div class="spacer"></div>
    <div class="who-line"><span>operator @ ${WHO}</span><button class="ghost">Sign out</button></div>`;
}

function stateButtons() {
  return Object.keys(STATES).map((k) =>
    `<button class="${k === stateKey ? "on" : ""}" onclick="setParam('state','${k}')">${k}</button>`).join(" ");
}

function render() {
  const body = variant === "B" ? variantB() : variant === "C" ? variantC() : variantA();
  document.getElementById("sidebar").innerHTML = sidebar();
  document.getElementById("paneTitle").textContent = V.title;
  document.getElementById("paneGroup").textContent = V.group;
  document.getElementById("swLbl").innerHTML = `<b>${variant}</b> — ${V.name} <span class="k">· ${stateKey}</span>`;
  const bar = `<div class="statebar" style="margin:0 0 14px"><div class="hint" style="margin-bottom:6px">prototype control — fake run state</div>${stateButtons()}</div>`;
  document.getElementById("paneBody").innerHTML = bar + body;
}

const order = ["A", "B", "C"];
const cycle = (d) => setParam("variant", order[(order.indexOf(variant) + d + order.length) % order.length]);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
